spring.application.name=atenas-api
server.port=8080

# ---------- Base de datos (MySQL / MariaDB de XAMPP) ----------
# La base "atenas_db" se crea sola la primera vez. XAMPP trae el usuario
# root sin clave; si le pusiste una, escríbela en password.
spring.datasource.url=jdbc:mysql://localhost:3306/atenas_db?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# Hibernate crea y actualiza las tablas a partir de las entidades.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------- Documentación ----------
# http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
